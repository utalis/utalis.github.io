<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HP連携ラベル表示テスト</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#2f2a3a;color:#fff;padding:16px;line-height:1.6}
h1{font-size:18px;margin:0 0 4px}
.box{max-width:560px;margin:0 auto}
.card{background:rgba(255,255,255,.06);border-radius:14px;padding:14px;margin-top:14px}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #888;background:#1e1a28;color:#fff;font-size:16px}
button{margin-top:8px;padding:10px 16px;border-radius:99px;border:0;background:#e8546b;color:#fff;font-weight:700;font-size:14px}
button.sub{background:#555}
ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
li{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.07)}
.t{font-weight:800}.a{font-size:12px;opacity:.75}
.mk{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mk span{font-size:10px;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(217,178,95,.16);border:1px solid rgba(217,178,95,.5);color:#f0d78c}
.mk .mk-learning{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3);color:#fff}
.note{font-size:12px;opacity:.8}
#msg{font-size:13px;margin-top:8px;min-height:1.4em}
</style>
</head>
<body>
<div class="box">
<h1>HP連携 ラベル表示テスト</h1>
<p class="note">「HPに反映する」で送った曲リストと、おはこ/お気に入り/練習中のラベルが、HP側で読めるかを確かめるテストページです。</p>
<div class="card">
<b>① 連携先(リンクID)から読む</b>
<input id="lid" placeholder="リンクID(例: ante-hp)" autocapitalize="off" autocomplete="off">
<button id="load">読み込む</button> <button class="sub" id="demo">② 見本データで見た目だけ確認</button>
<div id="msg"></div>
</div>
<div class="card"><b id="cnt">曲リスト</b><ul id="list"></ul></div>
</div>
<script>
var API='https://utaeru-api.manabit.workers.dev/api/hp/';
var MARKS={signature:'⭐ おはこ',favorite:'❤️ お気に入り',learning:'🔰 練習中'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(songs,info){
  var withM=songs.filter(function(s){return Array.isArray(s.m)&&s.m.length;}).length;
  document.getElementById('cnt').textContent=songs.length+'曲(ラベルつき '+withM+'曲)'+(info||'');
  document.getElementById('list').innerHTML=songs.map(function(s){
    var mk=(s.m||[]).filter(function(k){return MARKS[k];}).map(function(k){return '<span class="mk-'+k+'">'+MARKS[k]+'</span>';}).join('');
    return '<li><div class="t">'+esc(s.t)+'</div><div class="a">'+esc(s.a)+'</div>'+(mk?'<div class="mk">'+mk+'</div>':'')+'</li>';
  }).join('')||'<li class="note">曲がありません</li>';
}
function say(t,ok){var m=document.getElementById('msg');m.textContent=t;m.style.color=ok?'#9be29b':'#ffb0b0';}
document.getElementById('load').onclick=function(){
  var id=document.getElementById('lid').value.trim();
  if(!/^[a-z0-9-]+$/.test(id)){say('リンクIDは半角英小文字・数字・ハイフンです',false);return;}
  say('読み込み中…',true);
  fetch(API+encodeURIComponent(id)+'/songs',{cache:'no-cache',credentials:'omit'}).then(function(r){
    if(r.status===404){throw new Error('このIDは未連携、または未反映です(404)');}
    if(!r.ok)throw new Error('読み込み失敗('+r.status+')');
    return r.json();
  }).then(function(j){
    render(j.songs||[],' / 反映'+j.revision+'回目');
    var n=(j.songs||[]).filter(function(s){return s.m&&s.m.length;}).length;
    say(n?'ラベルが届いています ✅':'読み込めましたが、ラベルつきの曲がありません(ラベルを付けて再度「HPに反映する」が必要かも)',!!n);
  }).catch(function(e){say(e.message,false);});
};
document.getElementById('demo').onclick=function(){
  render([{t:'見本の曲A',a:'アーティスト1',m:['signature']},{t:'見本の曲B',a:'アーティスト2',m:['favorite','learning']},{t:'見本の曲C',a:'アーティスト3'}],' / 見本');
  say('見本データです(通信なし)',true);
};
var q=location.search.match(/[?&]id=([a-z0-9-]+)/);
if(q){document.getElementById('lid').value=q[1];document.getElementById('load').click();}
</script>
</body>
</html>
